<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Orders</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 0;
        }

        .header {
            background-color: #2c3e50;
            color: white;
            padding: 25px;
            text-align: center;
        }

        .header h1 {
            margin: 0;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 30px auto;
        }

        .card {
            background-color: white;
            padding: 25px;
            margin-bottom: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .home-button {
            display: inline-block;
            margin-bottom: 20px;
            text-decoration: none;
        }

        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            margin: 3px;
        }

        button:hover {
            background-color: #2980b9;
        }

        .delete-button {
            background-color: #e74c3c;
        }

        .delete-button:hover {
            background-color: #c0392b;
        }

        input {
            padding: 10px;
            width: 90%;
            max-width: 400px;
            border: 1px solid #ccc;
            border-radius: 5px;
            margin-top: 5px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: white;
        }

        th {
            background-color: #2c3e50;
            color: white;
        }

        th,
        td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: center;
        }

        tr:nth-child(even) {
            background-color: #f8f9fa;
        }

        .footer {
            text-align: center;
            background-color: #2c3e50;
            color: white;
            padding: 15px;
            margin-top: 40px;
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>Orders Management</h1>
    </div>

    <div class="container">

        <a href="/" class="home-button">
            <button type="button">Home</button>
        </a>

        <div class="card">

            <h2>Add Order</h2>

            <form id="orderForm">

                <label>Customer ID:</label>
                <br>
                <input type="number" id="customerId" required>

                <br><br>

                <label>Total Amount:</label>
                <br>
                <input type="number" id="totalAmount" step="0.01" required>

                <br><br>

                <button type="submit">Add Order</button>

            </form>

        </div>

        <div class="card">

            <h2>Orders List</h2>

            <table>

                <tr>
                    <th>ID</th>
                    <th>Customer</th>
                    <th>Order Date</th>
                    <th>Total Amount</th>
                    <th>Actions</th>
                </tr>

                <tr th:each="order : ${orders}">

                    <td th:text="${order.id}"></td>

                    <td th:text="${order.customer.name}"></td>

                    <td th:text="${order.orderDate}"></td>

                    <td th:text="${order.totalAmount}"></td>

                    <td>

                        <button type="button"
                                th:attr="onclick=|editOrder(${order.id}, ${order.customer.id}, ${order.totalAmount})|">
                            Edit
                        </button>

                        <button type="button"
                                class="delete-button"
                                th:attr="onclick=|deleteOrder(${order.id})|">
                            Delete
                        </button>

                    </td>

                </tr>

            </table>

        </div>

    </div>

    <div class="footer">
        <p>Food Retail Management System</p>
    </div>

    <script>

        document.getElementById("orderForm").addEventListener("submit", function(event) {

            event.preventDefault();

            const order = {
                customer: {
                    id: parseInt(document.getElementById("customerId").value)
                },
                totalAmount: parseFloat(document.getElementById("totalAmount").value)
            };

            fetch("/api/orders", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(order)
            })
            .then(response => response.json())
            .then(data => {
                alert("Order added successfully!");
                location.reload();
            })
            .catch(error => {
                alert("Error adding order!");
                console.error(error);
            });

        });


        function editOrder(id, customerId, totalAmount) {

            const newCustomerId = prompt(
                "Enter customer ID:",
                customerId
            );

            if (newCustomerId === null) {
                return;
            }

            const newTotalAmount = prompt(
                "Enter total amount:",
                totalAmount
            );

            if (newTotalAmount === null) {
                return;
            }

            const order = {
                customer: {
                    id: parseInt(newCustomerId)
                },
                totalAmount: parseFloat(newTotalAmount)
            };

            fetch("/api/orders/" + id, {
                method: "PUT",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(order)
            })
            .then(response => response.json())
            .then(data => {
                alert("Order updated successfully!");
                location.reload();
            })
            .catch(error => {
                alert("Error updating order!");
                console.error(error);
            });

        }


        function deleteOrder(id) {

            const confirmDelete = confirm(
                "Are you sure you want to delete this order?"
            );

            if (!confirmDelete) {
                return;
            }

            fetch("/api/orders/" + id, {
                method: "DELETE"
            })
            .then(response => response.text())
            .then(data => {
                alert(data);
                location.reload();
            })
            .catch(error => {
                alert("Error deleting order!");
                console.error(error);
            });

        }

    </script>

</body>

</html>
