<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Products</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 0;
        }

        .header {
            background-color: #2c3e50;
            color: white;
            padding: 25px;
            text-align: center;
        }

        .header h1 {
            margin: 0;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 30px auto;
        }

        .card {
            background-color: white;
            padding: 25px;
            margin-bottom: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .home-button {
            display: inline-block;
            margin-bottom: 20px;
            text-decoration: none;
        }

        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            margin: 3px;
        }

        button:hover {
            background-color: #2980b9;
        }

        .delete-button {
            background-color: #e74c3c;
        }

        .delete-button:hover {
            background-color: #c0392b;
        }

        input {
            padding: 10px;
            width: 90%;
            max-width: 400px;
            border: 1px solid #ccc;
            border-radius: 5px;
            margin-top: 5px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: white;
        }

        th {
            background-color: #2c3e50;
            color: white;
        }

        th,
        td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: center;
        }

        tr:nth-child(even) {
            background-color: #f8f9fa;
        }

        .footer {
            text-align: center;
            background-color: #2c3e50;
            color: white;
            padding: 15px;
            margin-top: 40px;
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>Products Management</h1>
    </div>

    <div class="container">

        <a href="/" class="home-button">
            <button type="button">Home</button>
        </a>

        <div class="card">

            <h2>Add Product</h2>

            <form id="productForm">

                <label>Product Name:</label>
                <br>
                <input type="text" id="name" required>

                <br><br>

                <label>Price:</label>
                <br>
                <input type="number" id="price" step="0.01" required>

                <br><br>

                <label>Quantity:</label>
                <br>
                <input type="number" id="quantity" required>

                <br><br>

                <button type="submit">Add Product</button>

            </form>

        </div>

        <div class="card">

            <h2>Products List</h2>

            <table>

                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Price</th>
                    <th>Quantity</th>
                    <th>Actions</th>
                </tr>

                <tr th:each="product : ${products}">
                    <td th:text="${product.id}"></td>
                    <td th:text="${product.name}"></td>
                    <td th:text="${product.price}"></td>
                    <td th:text="${product.quantity}"></td>

                    <td>
                        <button type="button"
                                th:attr="onclick=|editProduct(${product.id}, '${product.name}', ${product.price}, ${product.quantity})|">
                            Edit
                        </button>

                        <button type="button"
                                class="delete-button"
                                th:attr="onclick=|deleteProduct(${product.id})|">
                            Delete
                        </button>
                    </td>
                </tr>

            </table>

        </div>

    </div>

    <div class="footer">
        <p>Food Retail Management System</p>
    </div>

    <script>
        document.getElementById("productForm").addEventListener("submit", function(event) {

            event.preventDefault();

            const product = {
                name: document.getElementById("name").value,
                price: parseFloat(document.getElementById("price").value),
                quantity: parseInt(document.getElementById("quantity").value)
            };

            fetch("/api/products", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(product)
            })
            .then(response => response.json())
            .then(data => {
                alert("Product added successfully!");
                location.reload();
            })
            .catch(error => {
                alert("Error adding product!");
                console.error(error);
            });

        });


        function editProduct(id, name, price, quantity) {

            const newName = prompt("Enter product name:", name);

            if (newName === null) {
                return;
            }

            const newPrice = prompt("Enter product price:", price);

            if (newPrice === null) {
                return;
            }

            const newQuantity = prompt("Enter product quantity:", quantity);

            if (newQuantity === null) {
                return;
            }

            const product = {
                name: newName,
                price: parseFloat(newPrice),
                quantity: parseInt(newQuantity)
            };

            fetch("/api/products/" + id, {
                method: "PUT",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(product)
            })
            .then(response => response.json())
            .then(data => {
                alert("Product updated successfully!");
                location.reload();
            })
            .catch(error => {
                alert("Error updating product!");
                console.error(error);
            });
        }


        function deleteProduct(id) {

            const confirmDelete = confirm("Are you sure you want to delete this product?");

            if (!confirmDelete) {
                return;
            }

            fetch("/api/products/" + id, {
                method: "DELETE"
            })
            .then(response => response.text())
            .then(data => {
                alert(data);
                location.reload();
            })
            .catch(error => {
                alert("Error deleting product!");
                console.error(error);
            });
        }
    </script>

</body>

</html>
