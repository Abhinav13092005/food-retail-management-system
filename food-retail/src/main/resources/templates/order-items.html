<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Order Items</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 0;
        }

        .header {
            background-color: #2c3e50;
            color: white;
            padding: 25px;
            text-align: center;
        }

        .header h1 {
            margin: 0;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 30px auto;
        }

        .card {
            background-color: white;
            padding: 25px;
            margin-bottom: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .home-button {
            display: inline-block;
            margin-bottom: 20px;
            text-decoration: none;
        }

        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            margin: 3px;
        }

        button:hover {
            background-color: #2980b9;
        }

        .delete-button {
            background-color: #e74c3c;
        }

        .delete-button:hover {
            background-color: #c0392b;
        }

        input {
            padding: 10px;
            width: 90%;
            max-width: 400px;
            border: 1px solid #ccc;
            border-radius: 5px;
            margin-top: 5px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: white;
        }

        th {
            background-color: #2c3e50;
            color: white;
        }

        th,
        td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: center;
        }

        tr:nth-child(even) {
            background-color: #f8f9fa;
        }

        .footer {
            text-align: center;
            background-color: #2c3e50;
            color: white;
            padding: 15px;
            margin-top: 40px;
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>Order Items Management</h1>
    </div>

    <div class="container">

        <a href="/" class="home-button">
            <button type="button">Home</button>
        </a>

        <div class="card">

            <h2>Add Order Item</h2>

            <form id="orderItemForm">

                <label>Order ID:</label>
                <br>
                <input type="number" id="orderId" required>

                <br><br>

                <label>Product ID:</label>
                <br>
                <input type="number" id="productId" required>

                <br><br>

                <label>Quantity:</label>
                <br>
                <input type="number" id="quantity" required>

                <br><br>

                <label>Price:</label>
                <br>
                <input type="number" id="price" step="0.01" required>

                <br><br>

                <button type="submit">Add Order Item</button>

            </form>

        </div>

        <div class="card">

            <h2>Order Items List</h2>

            <table>

                <tr>
                    <th>ID</th>
                    <th>Order ID</th>
                    <th>Product</th>
                    <th>Quantity</th>
                    <th>Price</th>
                    <th>Actions</th>
                </tr>

                <tr th:each="item : ${orderItems}">

                    <td th:text="${item.id}"></td>

                    <td th:text="${item.order.id}"></td>

                    <td th:text="${item.product.name}"></td>

                    <td th:text="${item.quantity}"></td>

                    <td th:text="${item.price}"></td>

                    <td>

                        <button
                            type="button"
                            th:attr="onclick=|editOrderItem(${item.id}, ${item.order.id}, ${item.product.id}, ${item.quantity}, ${item.price})|">
                            Edit
                        </button>

                        <button
                            type="button"
                            class="delete-button"
                            th:attr="onclick=|deleteOrderItem(${item.id})|">
                            Delete
                        </button>

                    </td>

                </tr>

            </table>

        </div>

    </div>

    <div class="footer">
        <p>Food Retail Management System</p>
    </div>

    <script>

        document.getElementById("orderItemForm").addEventListener("submit", function(event) {

            event.preventDefault();

            const orderItem = {
                order: {
                    id: parseInt(document.getElementById("orderId").value)
                },
                product: {
                    id: parseInt(document.getElementById("productId").value)
                },
                quantity: parseInt(document.getElementById("quantity").value),
                price: parseFloat(document.getElementById("price").value)
            };

            fetch("/api/order-items", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(orderItem)
            })
            .then(response => response.json())
            .then(data => {
                alert("Order Item added successfully!");
                location.reload();
            })
            .catch(error => {
                alert("Error adding Order Item!");
                console.error(error);
            });

        });


        function editOrderItem(id, orderId, productId, quantity, price) {

            const newOrderId = prompt(
                "Enter Order ID:",
                orderId
            );

            if (newOrderId === null) {
                return;
            }

            const newProductId = prompt(
                "Enter Product ID:",
                productId
            );

            if (newProductId === null) {
                return;
            }

            const newQuantity = prompt(
                "Enter Quantity:",
                quantity
            );

            if (newQuantity === null) {
                return;
            }

            const newPrice = prompt(
                "Enter Price:",
                price
            );

            if (newPrice === null) {
                return;
            }

            const orderItem = {
                order: {
                    id: parseInt(newOrderId)
                },
                product: {
                    id: parseInt(newProductId)
                },
                quantity: parseInt(newQuantity),
                price: parseFloat(newPrice)
            };

            fetch("/api/order-items/" + id, {
                method: "PUT",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(orderItem)
            })
            .then(response => response.json())
            .then(data => {
                alert("Order Item updated successfully!");
                location.reload();
            })
            .catch(error => {
                alert("Error updating Order Item!");
                console.error(error);
            });

        }


        function deleteOrderItem(id) {

            const confirmDelete = confirm(
                "Are you sure you want to delete this order item?"
            );

            if (!confirmDelete) {
                return;
            }

            fetch("/api/order-items/" + id, {
                method: "DELETE"
            })
            .then(response => response.text())
            .then(data => {
                alert(data);
                location.reload();
            })
            .catch(error => {
                alert("Error deleting Order Item!");
                console.error(error);
            });

        }

    </script>

</body>

</html>
