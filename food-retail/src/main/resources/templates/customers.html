<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Customers</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 0;
        }

        .header {
            background-color: #2c3e50;
            color: white;
            padding: 25px;
            text-align: center;
        }

        .header h1 {
            margin: 0;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 30px auto;
        }

        .card {
            background-color: white;
            padding: 25px;
            margin-bottom: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .home-button {
            display: inline-block;
            margin-bottom: 20px;
            text-decoration: none;
        }

        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            margin: 3px;
        }

        button:hover {
            background-color: #2980b9;
        }

        .delete-button {
            background-color: #e74c3c;
        }

        .delete-button:hover {
            background-color: #c0392b;
        }

        input {
            padding: 10px;
            width: 90%;
            max-width: 400px;
            border: 1px solid #ccc;
            border-radius: 5px;
            margin-top: 5px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: white;
        }

        th {
            background-color: #2c3e50;
            color: white;
        }

        th,
        td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: center;
        }

        tr:nth-child(even) {
            background-color: #f8f9fa;
        }

        .footer {
            text-align: center;
            background-color: #2c3e50;
            color: white;
            padding: 15px;
            margin-top: 40px;
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>Customers Management</h1>
    </div>

    <div class="container">

        <a href="/" class="home-button">
            <button type="button">Home</button>
        </a>

        <div class="card">

            <h2>Add Customer</h2>

            <form id="customerForm">

                <label>Customer Name:</label>
                <br>
                <input type="text" id="name" required>

                <br><br>

                <label>Phone:</label>
                <br>
                <input type="text" id="phone">

                <br><br>

                <label>Email:</label>
                <br>
                <input type="email" id="email">

                <br><br>

                <button type="submit">Add Customer</button>

            </form>

        </div>

        <div class="card">

            <h2>Customers List</h2>

            <table>

                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Phone</th>
                    <th>Email</th>
                    <th>Actions</th>
                </tr>

                <tr th:each="customer : ${customers}">
                    <td th:text="${customer.id}"></td>
                    <td th:text="${customer.name}"></td>
                    <td th:text="${customer.phone}"></td>
                    <td th:text="${customer.email}"></td>

                    <td>

                        <button type="button"
                                th:attr="onclick=|editCustomer(${customer.id}, '${customer.name}', '${customer.phone}', '${customer.email}')|">
                            Edit
                        </button>

                        <button type="button"
                                class="delete-button"
                                th:attr="onclick=|deleteCustomer(${customer.id})|">
                            Delete
                        </button>

                    </td>
                </tr>

            </table>

        </div>

    </div>

    <div class="footer">
        <p>Food Retail Management System</p>
    </div>

    <script>

        document.getElementById("customerForm").addEventListener("submit", function(event) {

            event.preventDefault();

            const customer = {
                name: document.getElementById("name").value,
                phone: document.getElementById("phone").value,
                email: document.getElementById("email").value
            };

            fetch("/api/customers", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(customer)
            })
            .then(response => response.json())
            .then(data => {
                alert("Customer added successfully!");
                location.reload();
            })
            .catch(error => {
                alert("Error adding customer!");
                console.error(error);
            });

        });


        function editCustomer(id, name, phone, email) {

            const newName = prompt("Enter customer name:", name);

            if (newName === null) {
                return;
            }

            const newPhone = prompt("Enter customer phone:", phone);

            if (newPhone === null) {
                return;
            }

            const newEmail = prompt("Enter customer email:", email);

            if (newEmail === null) {
                return;
            }

            const customer = {
                name: newName,
                phone: newPhone,
                email: newEmail
            };

            fetch("/api/customers/" + id, {
                method: "PUT",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(customer)
            })
            .then(response => response.json())
            .then(data => {
                alert("Customer updated successfully!");
                location.reload();
            })
            .catch(error => {
                alert("Error updating customer!");
                console.error(error);
            });

        }


        function deleteCustomer(id) {

            const confirmDelete = confirm(
                "Are you sure you want to delete this customer?"
            );

            if (!confirmDelete) {
                return;
            }

            fetch("/api/customers/" + id, {
                method: "DELETE"
            })
            .then(response => response.text())
            .then(data => {
                alert(data);
                location.reload();
            })
            .catch(error => {
                alert("Error deleting customer!");
                console.error(error);
            });

        }

    </script>

</body>

</html>
